<svg xmlns="http://www.w3.org/2000/svg" width="720" height="90" viewBox="0 0 720 90" role="img" aria-labelledby="title desc">
  <title id="title">SwiftUI links without inline icons</title>
  <desc id="desc">The text Accept Terms and Conditions and Privacy Policy, with the two link labels in green.</desc>
  <rect width="720" height="90" fill="#ffffff"/>
  <text x="49" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#000000">Accept </text>
  <text x="117" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#20b84d">Terms and Conditions</text>
  <text x="407" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#000000"> and </text>
  <text x="483" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#20b84d">Privacy Policy</text>
</svg>
